name: ci

on:
  pull_request:
  push:
    branches:
    - main
  schedule:
    - cron: '00 01 * * 0'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        toolchain:
        - stable
        - beta
        - nightly
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.toolchain }}
    - name: Build validation
      run: cargo build
